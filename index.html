<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <link rel="stylesheet" href="./Styles/styles.css">
</head>
<body>
<main>
  <div class="card">
    <div class="image-section">
     <img src="./images/image-product-desktop.jpg" alt="Perfume bottle" class="product-image-mobile" loading="lazy">
       </div>
    <div class="details-section">
      <h3 class="company-name">Perfume</h3>
      <h2 class="brand-name">  Gabrielle Essence Eau De Parfum</h2>
      <p>A floral, solar, and voluptuous interpretation composed by Olivier Ploge, Perfumer-Creator for the House of CHANNEL</p>
      <div class="price-section">
        <span class="current-price">$149.99</span>
        <span class="original-price">$169.99</span>
      </div>
      <button class="add-to-cart-button">
        <img src="./images/icon-cart.svg" alt="Cart Icon" class="cart-icon" loading="lazy">
        Add to Cart
      </button>

  </div>
</main>  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://www.linkedin.com/in/powell-mweemba-991ab1260/">Powell Mweemba</a>.
  </div>
</body>
</html>
